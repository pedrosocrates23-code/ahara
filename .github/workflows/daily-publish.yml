name: Publicação programada diária

# Dispara um rebuild do site no Vercel todo dia às 07:00 (horário de Brasília).
# Como o site é estático, o post cujo pub_date venceu só "aparece" no próximo build —
# este cron é o gatilho diário. 10:00 UTC = 07:00 BRT (America/Sao_Paulo, UTC-3).
#
# Por que GitHub Actions + Deploy Hook (e não Vercel Cron Jobs):
# a doc oficial da Vercel indica Deploy Hook + serviço de cron externo como o método
# para "scheduled deployments" (https://vercel.com/docs/deploy-hooks). Vercel Cron Jobs
# apenas invocam uma Serverless Function num schedule — NÃO disparam rebuild de site
# estático. Usar Cron exigiria converter este site para SSR só para isto (desnecessário).
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}   # permite disparo manual pelo botão "Run workflow"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar rebuild no Vercel (Deploy Hook)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "ERRO: secret VERCEL_DEPLOY_HOOK não configurado no repositório."
            echo "Crie em: Vercel > Project > Settings > Git > Deploy Hooks (branch main)"
            echo "e adicione em: GitHub > repo > Settings > Secrets and variables > Actions"
            exit 1
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null -w "HTTP %{http_code}\n"
          echo "Rebuild diário disparado com sucesso."
